[project]
name = "encore"
version = "0.1.0"
description = "Encore Programming Language Compiler"
readme = "README.md"
authors = [
    { name = "Maksim Shushkevich", email = "m.e.shushkevich@yandex.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "ehir-llvm-backend",
    "ehir",
    "pydantic>=2.12.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.11",
    "ty>=0.0.10",
]

[tool.uv.sources]
ehir = { git = "https://github.com/encore-language/ehir.git", branch = "feature/safe_pointers" }
ehir-llvm-backend = { git = "https://github.com/encore-language/ehir-llvm-backend", branch = "feature/safe_pointers" }

[project.scripts]
encore = "encore.cli:main"

[build-system]
requires = ["uv_build>=0.9.22,<0.10.0"]
build-backend = "uv_build"
