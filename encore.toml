[project]
name = "encore"
version = "0.1.5"
description = ""
readme = "README.md"
licence = "MIT"
# v0.1.5 remains buildable by the previous stable compiler while using the
# bootstrap-compatible backend published ahead of the system-library split.
dependencies = [ "index@std@1.0.0", "index@rich@1.0.0", "index@json@1.0.0", "index@ehirlib@0.0.0", "index@ehir_llvm_backend@0.0.1", "index@toml@1.0.0", "index@colorterm@1.0.0",]

[target.x86_64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto"]

[target.aarch64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto"]
