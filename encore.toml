[project]
name = "encore"
version = "0.1.9"
description = ""
readme = "README.md"
licence = "MIT"
# The compiler remains self-hosting through local path dependencies. Release
# artifacts embed the exact compatible system-library sources used here.
dependencies = [ "path@packages/std", "path@packages/rich", "path@packages/json", "path@packages/ehir", "path@packages/ehir-llvm-backend", "path@packages/toml", "path@packages/colorterm", "path@packages/argparse", "path@packages/secret-store",]

[target.x86_64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto", "-lcares", "-Wl,--allow-multiple-definition"]

[target.aarch64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto", "-lcares"]
