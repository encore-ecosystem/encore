[project]
name = "ehir"
version = "0.1.0"
description = "Encore High Intermediate Representation"
readme = "README.md"
authors = [
    {name = "Maksim Shushkevich", email = "m.e.shushkevich@yandex.com"}
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "llvmlite>=0.46.0",
    "rich>=14.2.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "ty>=0.0.8",
]

[project.scripts]
ehir = "ehir.cli:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
