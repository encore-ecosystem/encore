[project]
name = "dto_plugin"
version = "1.0.0"
target = "shared_lib"
dependencies = ["path@../dto-api", "path@../../../../packages/std"]
[plugin.exports.echo]
interface = "dto_api::Echo[dto_api::Envelope]"
factory = "create_echo"
stateless = true

[plugin.exports.marker]
interface = "dto_api::Marker[u32]"
factory = "create_echo"
stateless = true
