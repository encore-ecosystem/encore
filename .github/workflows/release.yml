name: Publish approved Encore 0.1.15 release

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: read

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_COMMIT: 10f7ecb80b3d0948746aeca74350dc39da31fe61
      RELEASE_TAG: v0.1.15-neumann
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: 10f7ecb80b3d0948746aeca74350dc39da31fe61
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Wait for native artifacts and cancel the remaining full suites
        run: python3 ../scripts/verify-as-is-release.py --wait

      - name: Verify exact native build and owner-approved test exception
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          release=$(python3 scripts/project-metadata.py --field release)
          version=${release%%-*}
          release_name=${release#*-}
          test "${RELEASE_TAG#v}" = "$release"
          test "$release" = "$version-$release_name"
          if [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}$ ]]; then
            channel=nightly
          elif [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+(\.[0-9]+)?$ ]]; then
            channel=beta
          elif [[ "$release_name" =~ ^[a-z][a-z0-9-]*$ ]] && test "$release" = "$version-$release_name"; then
            channel=stable
          else
            echo "::error::Unsupported release version $release"
            exit 1
          fi
          git fetch origin trunk
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/trunk
          python3 ../scripts/verify-as-is-release.py
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "display_name=${release_name^}" >> "$GITHUB_OUTPUT"

      - name: Download exact tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu
          do
            gh run download "${{ steps.candidate.outputs.run_id }}" \
              --name "release-candidate-$triple" \
              --dir "target/candidates/$triple"
            cp "target/candidates/$triple"/* dist/
          done
          for target in \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu \
            aarch64-unknown-linux-gnu
          do
            gh run download "${{ steps.candidate.outputs.run_id }}" \
              --name "release-candidate-target-kit-$target" \
              --dir "target/candidates/target-kit-$target"
            cp "target/candidates/target-kit-$target"/* dist/
          done

      - name: Describe bundled SDK byte differences
        run: python3 ../scripts/diagnose-release-sdk.py

      - name: Verify provenance and generate release manifest
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          release=$(python3 scripts/project-metadata.py --field release)
          version=${release%%-*}
          release_name=${release#*-}
          assets=
          # All targets must originate from the same resolved build inputs.
          jq -se '
            length == 6 and
            ([.[] | [.seed, .commit, .sdk_sha256, .sdk_packages]] | unique | length) == 1
          ' dist/provenance-*.json >/dev/null
          : > dist/SHA256SUMS
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu
          do
            jq -e --arg commit "${{ steps.candidate.outputs.source_commit }}" --arg version "$version" \
              --arg nametag "$release_name" --arg release "$release" --arg target "$triple" '
              .schema == 3 and .commit == $commit and .version == $version and
              .nametag == $nametag and .release == $release and .target == $target and
              .converged == true and .profile == "extreme" and .lsp_profile == "extreme" and
              (.seed | type == "string" and length > 0) and
              ([.compiler_sha256, .lsp_sha256, .stage2_sha256, .stage3_sha256] |
                all(.[]; type == "string" and test("^[0-9a-f]{64}$"))) and
              .stage2_sha256 == .stage3_sha256 and .stage3_sha256 == .compiler_sha256
              ' "dist/provenance-$triple.json" >/dev/null
            python3 scripts/sdk_packages.py verify-provenance "dist/provenance-$triple.json"
            extension=tar.gz
            format=tar.gz
            case "$triple" in *-windows-*) extension=zip; format=zip ;; esac
            asset="encore-$triple.$extension"
            expected=$(awk 'NF {print tolower($1); exit}' "dist/$asset.sha256")
            actual=$(sha256sum "dist/$asset" | awk '{print $1}')
            test "$actual" = "$expected"
            bash scripts/verify-release-archive.sh "$triple" "$release" \
              "dist/$asset" "dist/provenance-$triple.json"
            printf '%s  %s\n' "$actual" "$asset" >> dist/SHA256SUMS
            entry="{\"triple\":\"$triple\",\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$asset\",\"sha256\":\"$actual\",\"format\":\"$format\"}"
            if test -n "$assets"; then assets="$assets,$entry"; else assets=$entry; fi
          done
          for descriptor in dist/target-kit-*.json; do
            test "$(jq -r '.schema' "$descriptor")" = 1
            test "$(jq -r '.sdk_sha256' "$descriptor")" = "$(jq -r '.sdk_sha256' dist/provenance-x86_64-unknown-linux-gnu.json)"
            test "$(jq -r '.platform_commit' "$descriptor")" = "$(jq -r '.sdk_packages[] | select(.path == "packages/platform") | .commit' dist/provenance-x86_64-unknown-linux-gnu.json)"
            target_kit_abi=$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')
            test "$(jq -r '.abi' "$descriptor")" = "$target_kit_abi"
            archive=$(basename "$(jq -r '.archive' "$descriptor")")
            expected=$(jq -r '.sha256' "$descriptor")
            test "$expected" = "$(sha256sum "dist/$archive" | awk '{print $1}')"
            test "$expected" = "$(awk 'NF {print tolower($1); exit}' "dist/$archive.sha256")"
            printf '%s  %s\n' "$expected" "$archive" >> dist/SHA256SUMS
          done
          LC_ALL=C sort -o dist/SHA256SUMS dist/SHA256SUMS
          # Keep original build provenance unchanged; record adoption separately.
          jq -n --arg release_commit "$RELEASE_COMMIT" \
            --arg source_commit "${{ steps.candidate.outputs.source_commit }}" \
            --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg run_id "${{ steps.candidate.outputs.run_id }}" \
            '{schema:1, release_commit:$release_commit, source_commit:$source_commit,
              source_tree:$tree, build_run_id:$run_id, full_compiler_tests_complete:false,
              verification_exception:"verification-exception.json"}' > dist/adoption.json
          jq -n --arg channel "$CHANNEL" --arg version "$version" \
            --arg nametag "$release_name" --arg release "$release" \
            --arg tag "$RELEASE_TAG" --arg commit "$RELEASE_COMMIT" \
            --argjson assets "[$assets]" '
            {schema:2, channel:$channel, version:$version, nametag:$nametag,
              release:$release, tag:$tag, commit:$commit,
              verification:{converged:true, targets:($assets | length), compiler_tests_complete:false,
                exception:"verification-exception.json", source_validation_run_id:42373979388}, assets:$assets}
          ' > dist/channel.json

      - uses: softprops/action-gh-release@v3
        with:
          # Immutable releases must receive every asset while they are still a
          # draft. Publishing a prerelease first makes all subsequent uploads
          # fail, leaving behind an empty release.
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ env.RELEASE_COMMIT }}
          body: |
            Adds Python-style synchronous generators with shared lazy cursors, preserved locals and deterministic context cleanup. Includes the SDK submodule migration and selected package fixes.

            Published as-is at the owner's explicit request. The full MSVC compiler suite was cancelled before completion (683/724 passing tests observed in the first attempt, no observed failures). Five other full compiler suites passed. Fresh release binaries passed native bootstrap convergence, lifecycle, archive and installed-SDK checks on all six targets. See verification-exception.json for the recorded exception.
          files: |
            source/dist/encore-*
            source/dist/target-kit-*
            source/dist/SHA256SUMS
            source/dist/channel.json
            source/dist/provenance-*
            source/dist/adoption.json
            source/dist/verification-exception.json
          generate_release_notes: true
          name: Encore ${{ steps.candidate.outputs.version }} — ${{ steps.candidate.outputs.display_name }}
          prerelease: ${{ steps.candidate.outputs.channel != 'stable' }}

      - name: Publish immutable release
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          if test "$CHANNEL" = stable; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            gh release edit "$RELEASE_TAG" --draft=false --latest=false
          fi

      - name: Publish atomic channel pointer
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          pointer_branch="release-channel-$CHANNEL"
          pointer_index=$(mktemp)
          trap 'rm -f "$pointer_index"' EXIT
          export GIT_INDEX_FILE=$pointer_index
          parent_args=()
          git read-tree --empty
          if git fetch origin "refs/heads/$pointer_branch"; then
            git read-tree FETCH_HEAD
            parent_args=(-p FETCH_HEAD)
          fi
          blob=$(git hash-object -w dist/channel.json)
          git update-index --add --cacheinfo 100644 "$blob" channel.json
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=github-actions GIT_COMMITTER_NAME=github-actions
          export GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          export GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          commit=$(printf 'Update %s release channel to %s\n' "$CHANNEL" "$RELEASE_TAG" | \
            git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit:refs/heads/$pointer_branch"
