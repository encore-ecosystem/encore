name: Native Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used inside archives
        required: true
        default: nightly

permissions:
  contents: write

jobs:
  seeds:
    name: Prepare released compiler seeds
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.released }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_CORE_DIR: ${{ github.workspace }}/index/core
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Verify release sources and bootstrap
        run: |
          scripts/verify-version.sh
          scripts/verify-no-python.sh
          scripts/verify-stage0.sh --release
      - name: Download latest complete native release
        id: release
        shell: bash
        run: |
          set -eu
          released=false
          if tag=$(gh release view --json tagName --jq .tagName 2>/dev/null); then
            mkdir -p seeds
            complete=true
            for asset in \
              encore-x86_64-unknown-linux-gnu.tar.gz \
              encore-aarch64-unknown-linux-gnu.tar.gz \
              encore-x86_64-apple-darwin.tar.gz \
              encore-aarch64-apple-darwin.tar.gz \
              encore-x86_64-pc-windows-msvc.zip
            do
              if ! gh release download "$tag" --pattern "$asset" --dir seeds; then
                complete=false
                break
              fi
            done
            if [ "$complete" = true ]; then released=true; else rm -rf seeds; fi
          fi
          echo "released=$released" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.released == 'true'
        with:
          name: native-release-seeds
          path: seeds/*
          if-no-files-found: error
          retention-days: 1
      - name: Generate first-release bootstrap IR
        if: steps.release.outputs.released != 'true'
        shell: bash
        run: |
          mkdir -p target
          gzip -dc bootstrap/encore-stage0-linux-x86_64.gz > target/encore-stage0
          chmod +x target/encore-stage0
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            target/encore-stage0 build --profile extreme --target "$triple" --emit llvm-ir
          done
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.released != 'true'
        with:
          name: first-release-bootstrap-ir
          path: target/*/extreme/encore.ll
          if-no-files-found: error
          retention-days: 1

  build:
    name: Build ${{ matrix.triple }} release
    needs: seeds
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/index/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - uses: actions/download-artifact@v8
        if: needs.seeds.outputs.released == 'true'
        with:
          name: native-release-seeds
          path: seeds
      - uses: actions/download-artifact@v8
        if: needs.seeds.outputs.released != 'true'
        with:
          name: first-release-bootstrap-ir
          path: target
      - name: Extract released compiler
        if: needs.seeds.outputs.released == 'true'
        shell: bash
        run: |
          set -eu
          mkdir -p target/seed unpacked-seed
          case "${{ matrix.triple }}" in
            *-windows-*) unzip -q "seeds/encore-${{ matrix.triple }}.zip" -d unpacked-seed ;;
            *) tar -xzf "seeds/encore-${{ matrix.triple }}.tar.gz" -C unpacked-seed ;;
          esac
          seed=$(find unpacked-seed -type f -path "*/bin/${{ matrix.executable }}" | head -n 1)
          test -n "$seed"
          cp "$seed" "target/seed/${{ matrix.executable }}"
          chmod +x "target/seed/${{ matrix.executable }}" 2>/dev/null || true
      - name: Assemble first-release compiler
        if: needs.seeds.outputs.released != 'true'
        shell: bash
        run: |
          mkdir -p target/seed
          link_args=()
          case "${{ matrix.triple }}" in
            *-linux-*) link_args=(-lssl -lcrypto) ;;
            *-apple-*) link_args=(-framework Security -framework CoreFoundation) ;;
          esac
          clang -O3 -w \
            "target/${{ matrix.triple }}/extreme/encore.ll" \
            runtime.c index/core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            "${link_args[@]}" \
            -o "target/seed/${{ matrix.executable }}"
      - name: Build current compiler twice
        shell: bash
        run: |
          set -eu
          seed="$PWD/target/seed/${{ matrix.executable }}"
          "$seed" --version
          "$seed" build --profile extreme
          mkdir -p target/stage1
          cp "target/extreme/${{ matrix.executable }}" "target/stage1/${{ matrix.executable }}"
          mv target/extreme target/stage1-extreme
          stage1="$PWD/target/stage1/${{ matrix.executable }}"
          "$stage1" build --profile extreme
          mkdir -p target/stage2
          cp "target/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          "target/stage2/${{ matrix.executable }}" --version
      - name: Verify tagged compiler version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          expected=${RELEASE_VERSION#v}
          actual=$("target/stage2/${{ matrix.executable }}" --version)
          test "$actual" = "encore $expected" || {
            echo "::error title=Release version mismatch::Tag $RELEASE_VERSION requires 'encore $expected', got '$actual'"
            exit 1
          }
      - name: Run native tests
        shell: bash
        run: |
          set -eu
          compiler="$PWD/target/stage2/${{ matrix.executable }}"
          for package in index/core index/color index/colorterm index/dict index/ehir index/ehir-llvm-backend index/encore-ui index/geometry index/json index/llvm index/log index/lsp index/rich index/std index/toml .; do
            (cd "$package" && "$compiler" test)
          done
      - name: Verify Linux release workflows
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          compiler="$PWD/target/stage2/${{ matrix.executable }}"
          scripts/test-test-runner.sh "$compiler"
          scripts/test-analyzer.sh "$compiler"
          scripts/test-tooling-foundation.sh "$compiler"
          scripts/test-lsp-integration.sh "$compiler"
          scripts/test-cli-contract.sh "$compiler"
          scripts/test-release-channels.sh
          scripts/smoke-cross-target.sh "$compiler"
      - name: Verified native HTTPS integration
        shell: bash
        run: scripts/test-https-stack.sh "$PWD/target/stage2/${{ matrix.executable }}"
      - name: Verified native self update
        shell: bash
        run: scripts/test-self-update.sh "$PWD/target/stage2/${{ matrix.executable }}"
      - name: Package native release
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          package_version=${RELEASE_VERSION#v}
          mkdir -p dist
          archive=$(scripts/package-release.sh "target/stage2/${{ matrix.executable }}" "${{ matrix.triple }}" "$package_version" dist)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          scripts/verify-release-package.sh "$archive" "${{ matrix.triple }}" "$package_version"
          duplicate=$(scripts/package-release.sh "target/stage2/${{ matrix.executable }}" "${{ matrix.triple }}" "$package_version" dist-reproducible)
          cmp "$archive" "$duplicate"
      - uses: actions/upload-artifact@v7
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Verify complete release artifact set
        run: scripts/verify-release-set.sh dist
      - name: Resolve release channel and generate update manifest
        id: release_meta
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          version=${RELEASE_VERSION#v}
          channel=$(scripts/release-channel.sh "$version")
          scripts/generate-release-manifest.sh \
            dist "$version" "$RELEASE_VERSION" "$GITHUB_SHA" "$GITHUB_REPOSITORY" channel.json
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - name: Generate checksum-pinned PKGBUILD
        if: steps.release_meta.outputs.channel == 'stable'
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: scripts/generate-pkgbuild.sh "${RELEASE_VERSION#v}" dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.release_meta.outputs.channel != 'stable' }}
      - name: Publish atomic channel pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.release_meta.outputs.channel }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          set -eu
          pointer="channel-$CHANNEL"
          if gh release view "$pointer" >/dev/null 2>&1; then
            gh release upload "$pointer" dist/channel.json --clobber
            gh release edit "$pointer" --notes "Current $CHANNEL compiler: Encore $VERSION"
          else
            gh release create "$pointer" dist/channel.json \
              --target "$GITHUB_SHA" \
              --title "Encore $CHANNEL channel" \
              --notes "Current $CHANNEL compiler: Encore $VERSION" \
              --prerelease
          fi
