name: Native Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write

env:
  ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/a931b185d56bc9ae9515cfdabde721486a8c7b0c

jobs:
  build:
    name: Build ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          test "$(tr -d '\r\n' < VERSION)" = "$version"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' encore.toml | head -n 1)" = "$version"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+|-nightly\.[0-9]{8})?$ ]] || {
            echo "Unsupported release version: $version" >&2
            exit 1
          }

      - name: Download previous complete trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seeds
          extension=tar.gz
          case "${{ matrix.triple }}" in *-windows-*) extension=zip ;; esac
          asset="encore-${{ matrix.triple }}.$extension"
          selected=
          while IFS= read -r tag; do
            test "$tag" != "$GITHUB_REF_NAME" || continue
            case "$tag" in channel-*) continue ;; esac
            candidate="target/seeds/$tag"
            mkdir -p "$candidate"
            if gh release download "$tag" \
              --pattern "$asset" \
              --pattern "$asset.sha256" \
              --dir "$candidate" >/dev/null 2>&1
            then
              selected=$tag
              echo "SEED_DOWNLOAD_DIR=$PWD/$candidate" >> "$GITHUB_ENV"
              break
            fi
          done < <(gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName')
          test -n "$selected" || {
            echo "::error::No previous complete trusted release contains ${{ matrix.triple }}"
            exit 1
          }
          echo "Using trusted compiler $selected"

      - name: Verify and extract trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          extension=tar.gz
          case "${{ matrix.triple }}" in *-windows-*) extension=zip ;; esac
          asset="encore-${{ matrix.triple }}.$extension"
          expected=$(awk 'NF {print tolower($1); exit}' "$SEED_DOWNLOAD_DIR/$asset.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$SEED_DOWNLOAD_DIR/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$SEED_DOWNLOAD_DIR/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          mkdir -p target/seed-unpacked
          case "$extension" in
            zip) unzip -q "$SEED_DOWNLOAD_DIR/$asset" -d target/seed-unpacked ;;
            *) tar -xzf "$SEED_DOWNLOAD_DIR/$asset" -C target/seed-unpacked ;;
          esac
          distribution=$(find target/seed-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -s "$distribution/bin/${{ matrix.executable }}"
          test -f "$distribution/lib/encore/index/core/encore.toml"
          echo "ENCORE_HOME=$PWD/$distribution" >> "$GITHUB_ENV"
          echo "ENCORE_CORE_DIR=$PWD/$distribution/lib/encore/index/core" >> "$GITHUB_ENV"
          echo "SEED_COMPILER=$PWD/$distribution/bin/${{ matrix.executable }}" >> "$GITHUB_ENV"

      - name: Resolve dependencies and self-host twice
        shell: bash
        run: |
          set -euo pipefail
          "$SEED_COMPILER" sync
          "$SEED_COMPILER" build --profile extreme
          mkdir -p target/stage1
          cp "target/extreme/${{ matrix.executable }}" "target/stage1/${{ matrix.executable }}"
          mv target/extreme target/stage1-output
          "target/stage1/${{ matrix.executable }}" build --profile extreme
          mkdir -p target/stage2
          cp "target/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          cmp "target/stage1/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          test "$("target/stage2/${{ matrix.executable }}" --version)" = "encore ${GITHUB_REF_NAME#v}"

      - name: Run release tests
        shell: bash
        run: |
          set -euo pipefail
          "target/stage2/${{ matrix.executable }}" test

      - name: Assemble reproducible toolchain archive
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          package="encore-$version-${{ matrix.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage2/${{ matrix.executable }}" "$root/bin/${{ matrix.executable }}"
          chmod +x "$root/bin/${{ matrix.executable }}" 2>/dev/null || true
          for name in core std rich json ehirlib ehir_llvm_backend toml colorterm log llvm; do
            if test "$name" = core; then
              source="$ENCORE_CORE_DIR"
              destination=core
            else
              source=$(find "$PWD/target/registry/packages/$name" -mindepth 1 -maxdepth 1 -type d | head -n 1)
              destination=$name
              case "$name" in ehirlib) destination=ehir ;; ehir_llvm_backend) destination=ehir-llvm-backend ;; esac
            fi
            test -f "$source/encore.toml"
            cp -R "$source" "$root/lib/encore/index/$destination"
          done
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '%s\n' "$version" > "$root/VERSION"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ matrix.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ matrix.triple }}.zip"
              (cd target/package && COPYFILE_DISABLE=1 tar -a -cf "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ matrix.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi

      - name: Smoke-test packaged distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/package-smoke
          archive=$(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) | head -n 1)
          tar -xf "$archive" -C target/package-smoke
          root=$(find target/package-smoke -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test "$("$root/bin/${{ matrix.executable }}" --version)" = "encore ${GITHUB_REF_NAME#v}"
          test -f "$root/lib/encore/index/core/runtime.c"

      - uses: actions/upload-artifact@v7
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Verify release set and generate manifests
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}$ ]]; then
            channel=nightly
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            channel=beta
          elif [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            channel=stable
          else
            echo "Unsupported release channel: $version" >&2
            exit 1
          fi
          assets=
          checksums=dist/SHA256SUMS
          : > "$checksums"
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc
          do
            extension=tar.gz
            format=tar.gz
            case "$triple" in *-windows-*) extension=zip; format=zip ;; esac
            asset="encore-$triple.$extension"
            test -s "dist/$asset"
            test -s "dist/$asset.sha256"
            checksum=$(awk 'NF {print tolower($1); exit}' "dist/$asset.sha256")
            printf '%s  %s\n' "$checksum" "$asset" >> "$checksums"
            entry="{\"triple\":\"$triple\",\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset\",\"sha256\":\"$checksum\",\"format\":\"$format\"}"
            if test -n "$assets"; then assets="$assets,$entry"; else assets=$entry; fi
          done
          LC_ALL=C sort -o "$checksums" "$checksums"
          printf '{"schema":1,"channel":"%s","version":"%s","tag":"%s","commit":"%s","assets":[%s]}\n' \
            "$channel" "$version" "$GITHUB_REF_NAME" "$GITHUB_SHA" "$assets" > dist/channel.json
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ steps.metadata.outputs.channel != 'stable' }}

      - name: Publish atomic channel pointer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.metadata.outputs.channel }}
        run: |
          set -euo pipefail
          pointer="channel-$CHANNEL"
          if gh release view "$pointer" >/dev/null 2>&1; then
            gh release upload "$pointer" dist/channel.json --clobber
            gh release edit "$pointer" --target "$GITHUB_SHA" \
              --notes "Current $CHANNEL compiler: Encore ${GITHUB_REF_NAME#v}"
          else
            gh release create "$pointer" dist/channel.json \
              --target "$GITHUB_SHA" \
              --title "Encore $CHANNEL channel" \
              --notes "Current $CHANNEL compiler: Encore ${GITHUB_REF_NAME#v}" \
              --prerelease
          fi
