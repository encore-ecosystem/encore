name: Native Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used inside archives
        required: true
        default: nightly

permissions:
  contents: write

jobs:
  bootstrap-ir:
    name: Generate bootstrap IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify native stage0
        run: sha256sum --check bootstrap/encore-stage0-linux-x86_64.sha256
      - name: Generate target IR
        working-directory: index/encore
        run: |
          mkdir -p target
          gzip -dc ../../bootstrap/encore-stage0-linux-x86_64.gz > target/encore-stage0
          chmod +x target/encore-stage0
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc
          do
            ./target/encore-stage0 build --profile extreme --target "$triple" --emit llvm-ir
          done
      - uses: actions/upload-artifact@v7
        with:
          name: bootstrap-ir
          path: index/encore/target/*/extreme/encore.ll
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify native release
    needs: bootstrap-ir
    runs-on: ubuntu-latest
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-ir
          path: index/encore/target
      - name: Assemble native seed
        run: |
          mkdir -p index/encore/target/extreme
          clang -O0 -w \
            index/encore/target/x86_64-unknown-linux-gnu/extreme/encore.ll \
            core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            -o index/encore/target/extreme/encore
      - name: Double self-host
        working-directory: index/encore
        run: |
          ./target/extreme/encore build --profile debug --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/debug/encore target/extreme/encore
          ./target/extreme/encore build --profile extreme --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/extreme/encore target/extreme/encore
      - name: Run full native test suite
        run: |
          compiler="$PWD/index/encore/target/extreme/encore"
          for package in core index/ehir index/ehir-llvm-backend index/json index/log index/rich index/std index/toml; do
            (cd "$package" && "$compiler" test)
          done
          (cd index/encore && ./target/extreme/encore test)
      - name: Verify release installation
        run: |
          mkdir -p dist
          archive=$(scripts/package-release.sh index/encore/target/extreme/encore x86_64-unknown-linux-gnu verify dist)
          sha256sum "$archive" > "$archive.sha256"
          scripts/smoke-install.sh "$archive"

  build:
    needs: [bootstrap-ir, verify]
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: bootstrap-ir
          path: index/encore/target
      - name: Assemble native seed
        shell: bash
        run: |
          mkdir -p index/encore/target/extreme
          set +e
          output=$(clang -O0 -w \
            index/encore/target/${{ matrix.triple }}/extreme/encore.ll \
            core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            -o index/encore/target/extreme/${{ matrix.executable }} 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            message=${output//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Native seed assembly failed::$message"
            exit "$code"
          fi
      - name: Verify native seed
        shell: bash
        run: |
          index/encore/target/extreme/${{ matrix.executable }} --version
      - name: Native self-host and tests
        shell: bash
        working-directory: index/encore
        run: |
          ./target/extreme/${{ matrix.executable }} build --profile debug --target ${{ matrix.triple }}
          cp target/${{ matrix.triple }}/debug/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
          ./target/extreme/${{ matrix.executable }} build --profile extreme --target ${{ matrix.triple }}
          cp target/${{ matrix.triple }}/extreme/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
          ./target/extreme/${{ matrix.executable }} test --filter target_
      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          scripts/package-release.sh index/encore/target/extreme/${{ matrix.executable }} ${{ matrix.triple }} "$RELEASE_VERSION" dist
          archive=$(find dist -maxdepth 1 -type f | head -n 1)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          case "${{ matrix.triple }}" in
            *-windows-*) ;;
            *) scripts/smoke-install.sh "$archive" ;;
          esac
      - name: Verify Windows installation
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/smoke-install.ps1 -Archive "dist/encore-${{ matrix.triple }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'nightly') || contains(github.ref_name, 'unstable') }}
