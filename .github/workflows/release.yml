name: Native Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version used inside archives
        required: true
        default: nightly

permissions:
  contents: write

env:
  BOOTSTRAP_REF: e1fccafb2b3a37dcf549123ae3896fe80e96e03f

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOTSTRAP_REF }}
          path: .bootstrap
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bootstrap from frozen compiler
        shell: bash
        working-directory: index/encore
        run: uv run --project ../../.bootstrap encore-py build --profile extreme
      - name: Native self-host and tests
        shell: bash
        working-directory: index/encore
        run: |
          ./target/extreme/${{ matrix.executable }} build --profile extreme --target ${{ matrix.triple }}
          cp target/${{ matrix.triple }}/extreme/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
          ./target/extreme/${{ matrix.executable }} build --profile extreme
          ./target/extreme/${{ matrix.executable }} test --filter target_
      - name: Package
        id: package
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          mkdir -p dist
          scripts/package-release.sh index/encore/target/extreme/${{ matrix.executable }} ${{ matrix.triple }} "$RELEASE_VERSION" dist
          archive=$(find dist -maxdepth 1 -type f | head -n 1)
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: encore-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'nightly') || contains(github.ref_name, 'unstable') }}
