name: Native target verification

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      triple:
        required: true
        type: string
      executable:
        required: true
        type: string
      seed_tag:
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  converge:
    name: Converge ${{ inputs.triple }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
      ENCORE_CORE_DIR: ${{ github.workspace }}/packages/core
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          release=$(python3 scripts/project-metadata.py --field release)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"

      - name: Download and verify native seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seed
          extension=tar.gz
          [[ "${{ inputs.triple }}" == *-windows-* ]] && extension=zip
          asset="encore-${{ inputs.triple }}.$extension"
          gh release download "${{ inputs.seed_tag }}" \
            --pattern "$asset" --pattern "$asset.sha256" --dir target/seed
          expected=$(awk 'NF {print tolower($1); exit}' "target/seed/$asset.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "target/seed/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "target/seed/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          mkdir -p target/seed-unpacked
          case "$extension" in
            zip) unzip -q "target/seed/$asset" -d target/seed-unpacked ;;
            *) tar -xzf "target/seed/$asset" -C target/seed-unpacked ;;
          esac
          distribution=$(find target/seed-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          seed="$PWD/$distribution/bin/${{ inputs.executable }}"
          test -s "$seed"
          chmod +x "$seed" 2>/dev/null || true
          echo "SEED_COMPILER=$seed" >> "$GITHUB_ENV"

      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"

      - name: Test native artifact paths
        shell: bash
        run: |
          set -euo pipefail
          cc=${ENCORE_CC:-$(command -v clang)}
          binary="$PWD/target/native-artifact-paths"
          if [[ '${{ inputs.triple }}' == *-windows-* ]]; then binary+=.exe; fi
          "$cc" -std=c11 -O2 -Wall -Wextra -Werror tests/native/build_artifact_paths.c -o "$binary"
          "$binary"

      - name: Build and verify isolated native stages
        shell: bash
        env:
          CI_TARGET: ${{ inputs.triple }}
          CI_EXECUTABLE: ${{ inputs.executable }}
          CI_SEED_TAG: ${{ inputs.seed_tag }}
        run: bash scripts/ci-bootstrap.sh

      - name: Assemble stage3 context
        shell: bash
        run: |
          set -euo pipefail
          context=target/test-context
          mkdir -p "$context/bin"
          cp "target/stage3/${{ inputs.executable }}" "$context/bin/"
          cp target/convergence.json "$context/provenance.json"

      - uses: actions/upload-artifact@v7
        with:
          name: test-context-${{ inputs.triple }}
          path: target/test-context
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Test libraries and tooling ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Test system libraries
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          for package in core platform std serialize json binary ehir-core ehir ehir-llvm-backend toml; do
            (cd "packages/$package" && "$compiler" test --report target/test-report.json)
          done

      - name: Test EHIR compiler CLI, library API and independent backend
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          (cd packages/ehir && "$compiler" build)
          python3 scripts/test-ehir-compiler.py --compiler "$compiler" \
            --ehir "$PWD/packages/ehir/target/dev/ehir" \
            --registry "$ENCORE_REGISTRY_CACHE"

      - name: Test codec package metadata and native number conversion
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          python3 tests/fixtures/reflection_codecs/check.py "$compiler"
          clang -std=c11 -O2 tests/codec_native.c -o target/codec-native -lm
          target/codec-native
          clang -std=c11 -O2 tests/string_native.c -o target/string-native -lm
          target/string-native
          python3 scripts/generate-ehir-artifact-codec.py --check
          python3 scripts/generate-frontend-artifact-codec.py --check
          python3 scripts/generate-translation-environment-codec.py --check
          python3 scripts/generate-source-artifact-codec.py --check

      - name: Test synchronization ownership and races
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 scripts/test-sync-runtime.py
          python3 scripts/test-sync-runtime.py --sanitizer thread
          python3 scripts/test-http-async.py --compiler target/stage3/encore
          python3 scripts/test-cache-lifecycle.py --compiler target/stage3/encore

      - name: Test concurrent LLVM declaration closure index
        if: runner.os == 'Linux'
        shell: bash
        run: |
          clang -std=c11 -O2 -fsanitize=address,undefined tests/llvm_declaration_index.c -o target/llvm-declaration-index -pthread
          target/llvm-declaration-index

      - name: Test live terminal progress and redirected CLI output
        shell: bash
        run: |
          progress_cc=${ENCORE_CC:-$(command -v clang)}
          if command -v cygpath >/dev/null 2>&1; then
            progress_cc=$(cygpath -m "$progress_cc")
          fi
          python3 scripts/test-terminal-progress.py --cc "$progress_cc" --compiler "$PWD/target/stage3/${{ inputs.executable }}"

      - name: Verify the next release operator SDK with the bridge compiler
        shell: bash
        run: python3 scripts/test-language-bridge.py --compiler "$PWD/target/stage3/${{ inputs.executable }}"

      - name: Test package project constants
        shell: bash
        run: python3 scripts/test-project-constants.py --compiler "$PWD/target/stage3/${{ inputs.executable }}"

      - name: Test native static initialization and cycles
        shell: bash
        run: |
          static_cc=${ENCORE_CC:-$(command -v clang)}
          if command -v cygpath >/dev/null 2>&1; then
            static_cc=$(cygpath -m "$static_cc")
          fi
          python3 scripts/test-static-runtime.py --cc "$static_cc"

      - name: Test native node ownership and owner search
        shell: bash
        run: |
          node_cc=${ENCORE_CC:-$(command -v clang)}
          if command -v cygpath >/dev/null 2>&1; then
            node_cc=$(cygpath -m "$node_cc")
          fi
          python3 scripts/test-node-runtime.py --cc "$node_cc"

      - name: Test native plugins ABI, typed calls and reload
        shell: bash
        run: |
          plugin_cc=${ENCORE_CC:-$(command -v clang)}
          if command -v cygpath >/dev/null 2>&1; then
            plugin_cc=$(cygpath -m "$plugin_cc")
          fi
          python3 scripts/test-native-plugins.py --cc "$plugin_cc" --compiler "$PWD/target/stage3/${{ inputs.executable }}" --report target/native-plugins/test-report.json

      - name: Test compiler cache lifecycle
        shell: bash
        run: python3 scripts/test-cache-management.py "$PWD/target/stage3/${{ inputs.executable }}"

      - name: Build examples
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          while IFS= read -r manifest; do
            example=${manifest%/encore.toml}
            case "$example" in examples/bare_metal|*/compile_fail) continue ;; esac
            if test -f "$example/src/main.enq"; then
              (cd "$example" && "$compiler" build)
            else
              (cd "$example" && "$compiler" check)
            fi
          done < <(find examples -mindepth 2 -name encore.toml -print | LC_ALL=C sort)
          (cd examples/bare_metal && "$compiler" build --target thumbv7em-none-eabi --emit llvm-ir)
          (cd docs/enbook-en/examples/guide && "$compiler" build)

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ inputs.triple }}
          path: |
            target/tests/*.output.txt
            target/native-plugins/test-report.json
            target/diagnostics/**
            packages/*/target/test-report.json
            packages/*/target/tests/*.output.txt
            packages/*/target/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  tooling:
    name: Check source tools ${{ inputs.triple }}
    if: inputs.triple == 'x86_64-unknown-linux-gnu'
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      # Keep all three mandatory gates visible independently, and run them in
      # parallel with library/compiler tests instead of after the examples.
      - name: Check formatting
        shell: bash
        run: target/stage3/${{ inputs.executable }} format --check
      - name: Check source semantics
        if: '!cancelled()'
        shell: bash
        run: target/stage3/${{ inputs.executable }} check
      - name: Lint source
        if: '!cancelled()'
        shell: bash
        run: target/stage3/${{ inputs.executable }} lint --format json

  compiler-tests:
    name: Test compiler ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v6
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Test Darwin native node regressions
        if: inputs.triple == 'aarch64-apple-darwin'
        shell: bash
        run: bash scripts/ci-test-darwin-nodes.sh "$PWD/target/stage3/${{ inputs.executable }}"
      - name: Run complete compiler test suite
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          bash scripts/ci-test.sh "$compiler"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-test-report-${{ inputs.triple }}
          path: |
            target/test-report.json
            target/darwin-node-diagnostics/**
            target/ci-tests/darwin-node-*/target/tests/*.output.txt
            target/ci-tests/darwin-node-*/target/tests/*.ll
            target/ci-tests/darwin-node-*/target/tests/*.ehir
            target/ci-tests/darwin-node-*/target/tests/bin/**
            target/ci-tests/compiler/target/tests/*.output.txt
            target/ci-tests/compiler/target/diagnostics/**
            target/ci-tests/compiler/target/integration/**/target/tests/*.output.txt
            target/ci-tests/compiler/target/integration/**/target/diagnostics/**
            target/ci-tests/compiler/target/integration/**/report.json
            target/ci-tests/compiler/target/integration/**/filtered.json
            target/ci-tests/compiler/target/integration/**/compile-error.json
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/checkout@v6
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Build matching Encore language server
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          (cd lsp && "$compiler" build --profile extreme)
          source_name=lsp
          installed_name=encore-lsp
          if [[ "${{ inputs.triple }}" == *-windows-* ]]; then
            source_name=lsp.exe
            installed_name=encore-lsp.exe
          fi
          cp "lsp/target/extreme/$source_name" "target/stage3/$installed_name"
          chmod +x "target/stage3/$installed_name" 2>/dev/null || true

      - name: Test language server import actions
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 lsp/tests/code_actions.py "$PWD/target/stage3/encore-lsp"
          python3 lsp/tests/organize_imports.py "$PWD/target/stage3/encore-lsp"
          python3 lsp/tests/project_constants.py "$PWD/target/stage3/encore-lsp"

      - name: Verify macOS deployment target
        if: inputs.triple == 'aarch64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          for executable in encore encore-lsp; do
            minimum=$(xcrun vtool -show-build "target/stage3/$executable" |
              awk '$1 == "minos" && !minimum { minimum = $2 } END { print minimum }')
            case "$minimum" in
              "$MACOSX_DEPLOYMENT_TARGET"|"$MACOSX_DEPLOYMENT_TARGET.0") ;;
              *) echo "::error::$executable has unexpected minimum macOS $minimum"; exit 1 ;;
            esac
          done

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          release=$(python3 scripts/project-metadata.py --field release)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          package="encore-$release-${{ inputs.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage3/${{ inputs.executable }}" "$root/bin/${{ inputs.executable }}"
          chmod +x "$root/bin/${{ inputs.executable }}" 2>/dev/null || true
          lsp_executable=encore-lsp
          [[ "${{ inputs.triple }}" == *-windows-* ]] && lsp_executable=encore-lsp.exe
          cp "target/stage3/$lsp_executable" "$root/bin/$lsp_executable"
          chmod +x "$root/bin/$lsp_executable" 2>/dev/null || true
          for name in core platform std rich serialize json binary log profile ehir-core ehir ehir-llvm-backend toml colorterm llvm argparse secret-store; do
            test -f "$PWD/packages/$name/encore.toml"
            mkdir -p "$root/lib/encore/index/$name"
            git archive HEAD "packages/$name" |
              tar -xf - --strip-components=2 -C "$root/lib/encore/index/$name"
          done
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '%s\n' "$release" > "$root/VERSION"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
            else shasum -a 256 "$1" | awk '{print $1}'; fi
          }
          lsp_sha=$(hash_file "target/stage3/$lsp_executable")
          jq --arg lsp "$lsp_sha" '. + {lsp_sha256: $lsp, lsp_profile: "extreme"}' target/convergence.json \
            > "dist/provenance-${{ inputs.triple }}.json"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ inputs.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ inputs.triple }}.zip"
              (cd target/package && 7z a -tzip -mtc=off -mta=off "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ inputs.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
          bash scripts/verify-release-archive.sh "${{ inputs.triple }}" "$release" \
            "$archive" "dist/provenance-${{ inputs.triple }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ inputs.triple }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
