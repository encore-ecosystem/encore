name: Native target verification

on:
  workflow_call:
    inputs:
      runner:
        required: true
        type: string
      triple:
        required: true
        type: string
      executable:
        required: true
        type: string
      producer:
        description: Temporary per-target GNU bridge artifact; empty for native bootstrap
        default: ''
        type: string
      seed_tag:
        required: true
        type: string
      performance_baseline_tag:
        description: Optional published stable release tag for parallel performance comparison
        type: string
        default: ''
      performance_jobs:
        type: string
        default: auto

permissions:
  contents: read
  actions: read

jobs:
  converge:
    name: Converge ${{ inputs.triple }}
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
      ENCORE_CORE_DIR: ${{ github.workspace }}/packages/core
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' encore.toml | head -n 1)" = "$version"
          test "$release" = "$version-$release_name"
          grep -Fq "ret \"$version\"" src/version.enq
          grep -Fq "ret \"$release_name\"" src/version.enq
          grep -Fq "ret \"$release\"" src/version.enq

      - name: Download and verify native seed
        if: inputs.producer == ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seed
          extension=tar.gz
          [[ "${{ inputs.triple }}" == *-windows-* ]] && extension=zip
          asset="encore-${{ inputs.triple }}.$extension"
          gh release download "${{ inputs.seed_tag }}" \
            --pattern "$asset" --pattern "$asset.sha256" --dir target/seed
          expected=$(awk 'NF {print tolower($1); exit}' "target/seed/$asset.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "target/seed/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "target/seed/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          mkdir -p target/seed-unpacked
          case "$extension" in
            zip) unzip -q "target/seed/$asset" -d target/seed-unpacked ;;
            *) tar -xzf "target/seed/$asset" -C target/seed-unpacked ;;
          esac
          distribution=$(find target/seed-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          seed="$PWD/$distribution/bin/${{ inputs.executable }}"
          test -s "$seed"
          chmod +x "$seed" 2>/dev/null || true
          echo "SEED_COMPILER=$seed" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        if: inputs.producer != ''
        with:
          name: stage1-${{ inputs.producer }}
          path: target/stage1-download

      - name: Verify cross-produced stage1
        if: inputs.producer != ''
        shell: bash
        run: |
          set -euo pipefail
          root="target/stage1-download/${{ inputs.triple }}"
          manifest="$root/manifest.json"
          test "$(jq -r '.schema' "$manifest")" = 3
          test "$(jq -r '.commit' "$manifest")" = "$GITHUB_SHA"
          release=$(tr -d '\r\n' < VERSION)
          test "$(jq -r '.version' "$manifest")" = "${release%%-*}"
          test "$(jq -r '.nametag' "$manifest")" = "${release#*-}"
          test "$(jq -r '.release' "$manifest")" = "$release"
          test "$(jq -r '.seed' "$manifest")" = "${{ inputs.seed_tag }}"
          test "$(jq -r '.target' "$manifest")" = "${{ inputs.triple }}"
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          target_kit_abi=$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')
          test "$(jq -r '.target_kit_abi' "$manifest")" = "$target_kit_abi"
          compiler="$PWD/$root/${{ inputs.executable }}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$compiler" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$compiler" | awk '{print $1}')
          fi
          test "$actual" = "$(jq -r '.executable_sha256' "$manifest")"
          chmod +x "$compiler" 2>/dev/null || true
          echo "STAGE1_COMPILER=$compiler" >> "$GITHUB_ENV"
          echo "STAGE1_MANIFEST=$PWD/$manifest" >> "$GITHUB_ENV"

      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"

      - name: Build and verify isolated native stages
        shell: bash
        env:
          CI_TARGET: ${{ inputs.triple }}
          CI_EXECUTABLE: ${{ inputs.executable }}
          CI_SEED_TAG: ${{ inputs.seed_tag }}
        run: bash scripts/ci-bootstrap.sh "${STAGE1_COMPILER:-}"

      - name: Assemble stage3 context
        shell: bash
        run: |
          set -euo pipefail
          context=target/test-context
          mkdir -p "$context/bin"
          cp "target/stage3/${{ inputs.executable }}" "$context/bin/"
          cp target/convergence.json "$context/provenance.json"

      - uses: actions/upload-artifact@v7
        with:
          name: test-context-${{ inputs.triple }}
          path: target/test-context
          if-no-files-found: error
          retention-days: 7

  tests:
    name: Test libraries and tooling ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Test system libraries
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          for package in core platform std serialize json binary ehir ehir-llvm-backend; do
            (cd "packages/$package" && "$compiler" test --report target/test-report.json)
          done

      - name: Test codec package metadata and native number conversion
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          python3 tests/fixtures/reflection_codecs/check.py "$compiler"
          python3 tests/fixtures/reflection_scaling/check.py --compiler "$compiler"
          clang -std=c11 -O2 tests/codec_native.c -o target/codec-native -lm
          target/codec-native
          clang -std=c11 -O2 tests/string_native.c -o target/string-native -lm
          target/string-native

      - name: Test parallel benchmark contracts
        shell: bash
        run: python3 scripts/test-compiler-benchmarks.py

      - name: Test native static initialization and cycles
        shell: bash
        run: |
          static_cc=${ENCORE_CC:-$(command -v clang)}
          if command -v cygpath >/dev/null 2>&1; then
            static_cc=$(cygpath -m "$static_cc")
          fi
          python3 scripts/test-static-runtime.py --cc "$static_cc"

      - name: Test compiler cache lifecycle
        shell: bash
        run: python3 scripts/test-cache-management.py "$PWD/target/stage3/${{ inputs.executable }}"

      - name: Build examples
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          while IFS= read -r manifest; do
            example=${manifest%/encore.toml}
            case "$example" in examples/bare_metal|*/compile_fail) continue ;; esac
            if test -f "$example/src/main.enq"; then
              (cd "$example" && "$compiler" build)
            else
              (cd "$example" && "$compiler" check)
            fi
          done < <(find examples -mindepth 2 -name encore.toml -print | LC_ALL=C sort)
          (cd examples/bare_metal && "$compiler" build --target thumbv7em-none-eabi --emit llvm-ir)
          (cd docs/enbook-en/examples/guide && "$compiler" build)

      - name: Verify source tooling gates
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          "$compiler" format --check
          "$compiler" check
          "$compiler" lint

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ inputs.triple }}
          path: |
            target/tests/*.output.txt
            target/diagnostics/**
            packages/*/target/test-report.json
            packages/*/target/tests/*.output.txt
            packages/*/target/diagnostics/**
          if-no-files-found: warn
          retention-days: 7

  compiler-tests:
    name: Test compiler ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Run complete compiler test suite
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          bash scripts/ci-test.sh "$compiler"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-test-report-${{ inputs.triple }}
          path: |
            target/test-report.json
            target/ci-tests/compiler/target/tests/*.output.txt
            target/ci-tests/compiler/target/diagnostics/**
            target/ci-tests/compiler/target/integration/**/target/tests/*.output.txt
            target/ci-tests/compiler/target/integration/**/target/diagnostics/**
            target/ci-tests/compiler/target/integration/**/report.json
            target/ci-tests/compiler/target/integration/**/filtered.json
            target/ci-tests/compiler/target/integration/**/compile-error.json
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package ${{ inputs.triple }}
    needs: converge
    runs-on: ${{ inputs.runner }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Build matching Encore language server
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ inputs.executable }}"
          (cd lsp && "$compiler" build --profile release)
          source_name=lsp
          installed_name=encore-lsp
          if [[ "${{ inputs.triple }}" == *-windows-* ]]; then
            source_name=lsp.exe
            installed_name=encore-lsp.exe
          fi
          cp "lsp/target/release/$source_name" "target/stage3/$installed_name"
          chmod +x "target/stage3/$installed_name" 2>/dev/null || true

      - name: Test language server import actions
        if: inputs.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          python3 lsp/tests/code_actions.py "$PWD/target/stage3/encore-lsp"
          python3 lsp/tests/organize_imports.py "$PWD/target/stage3/encore-lsp"

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          package="encore-$release-${{ inputs.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage3/${{ inputs.executable }}" "$root/bin/${{ inputs.executable }}"
          chmod +x "$root/bin/${{ inputs.executable }}" 2>/dev/null || true
          lsp_executable=encore-lsp
          [[ "${{ inputs.triple }}" == *-windows-* ]] && lsp_executable=encore-lsp.exe
          cp "target/stage3/$lsp_executable" "$root/bin/$lsp_executable"
          chmod +x "$root/bin/$lsp_executable" 2>/dev/null || true
          for name in core platform std rich serialize json binary log profile ehir ehir-llvm-backend toml colorterm llvm argparse secret-store; do
            test -f "$PWD/packages/$name/encore.toml"
            mkdir -p "$root/lib/encore/index/$name"
            git archive HEAD "packages/$name" |
              tar -xf - --strip-components=2 -C "$root/lib/encore/index/$name"
          done
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '%s\n' "$release" > "$root/VERSION"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
            else shasum -a 256 "$1" | awk '{print $1}'; fi
          }
          lsp_sha=$(hash_file "target/stage3/$lsp_executable")
          jq --arg lsp "$lsp_sha" '. + {lsp_sha256: $lsp}' target/convergence.json \
            > "dist/provenance-${{ inputs.triple }}.json"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ inputs.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ inputs.triple }}.zip"
              (cd target/package && 7z a -tzip -mtc=off -mta=off "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ inputs.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi
          bash scripts/verify-release-archive.sh "${{ inputs.triple }}" "$release" \
            "$archive" "dist/provenance-${{ inputs.triple }}.json"

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ inputs.triple }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  performance:
    name: Parallel compiler performance ${{ inputs.triple }} r${{ matrix.repetition }}
    if: inputs.performance_baseline_tag != ''
    needs: converge
    runs-on: ${{ inputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: ./.github/actions/stage3-context
        with:
          triple: ${{ inputs.triple }}
          executable: ${{ inputs.executable }}
          seed_tag: ${{ inputs.seed_tag }}
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh "${{ inputs.triple }}"
      - name: Verify published baseline and exact compiler provenance
        id: baseline
        shell: bash
        env:
          BASELINE_TAG: ${{ inputs.performance_baseline_tag }}
          BENCHMARK_TARGET: ${{ inputs.triple }}
          BENCHMARK_EXECUTABLE: ${{ inputs.executable }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-[a-z][a-z0-9-]*$ ]]
          baseline_sha=$(git rev-parse "$BASELINE_TAG^{commit}")
          git merge-base --is-ancestor "$baseline_sha" "$GITHUB_SHA"
          baseline_tree=$(git rev-parse "$baseline_sha^{tree}")
          mkdir -p target/performance-baseline
          gh release view "$BASELINE_TAG" --json isDraft,isPrerelease > target/performance-baseline/release.json
          jq -e '.isDraft == false and .isPrerelease == false' target/performance-baseline/release.json
          extension=tar.gz
          [[ "$BENCHMARK_TARGET" == *-windows-* ]] && extension=zip
          asset="encore-$BENCHMARK_TARGET.$extension"
          gh release download "$BASELINE_TAG" --dir target/performance-baseline \
            --pattern "$asset" --pattern "$asset.sha256" \
            --pattern "provenance-$BENCHMARK_TARGET.json" --pattern adoption.json
          BASELINE_SHA="$baseline_sha" BASELINE_TREE="$baseline_tree" BASELINE_ASSET="$asset" python3 - <<'PYCODE'
          import hashlib, json, os, tarfile, zipfile
          from pathlib import Path
          root = Path('target/performance-baseline')
          asset = root / os.environ['BASELINE_ASSET']
          assert hashlib.sha256(asset.read_bytes()).hexdigest() == Path(str(asset) + '.sha256').read_text().split()[0].lower()
          adoption = json.loads((root / 'adoption.json').read_text())
          assert adoption['release_commit'] == os.environ['BASELINE_SHA']
          assert adoption['source_tree'] == os.environ['BASELINE_TREE']
          receipt = json.loads((root / ('provenance-' + os.environ['BENCHMARK_TARGET'] + '.json')).read_text())
          assert receipt['schema'] == 3 and receipt['commit'] == adoption['source_commit']
          assert receipt['target'] == os.environ['BENCHMARK_TARGET'] and receipt['converged'] is True
          unpacked = root / 'unpacked'
          if asset.suffix == '.zip':
              with zipfile.ZipFile(asset) as archive:
                  for member in archive.namelist():
                      assert (unpacked / member).resolve().is_relative_to(unpacked.resolve())
                  archive.extractall(unpacked)
          else:
              with tarfile.open(asset) as archive:
                  archive.extractall(unpacked, filter='data')
          compilers = list(unpacked.glob('*/bin/' + os.environ['BENCHMARK_EXECUTABLE']))
          assert len(compilers) == 1
          compiler = compilers[0]
          digest = hashlib.sha256(compiler.read_bytes()).hexdigest()
          assert digest == receipt['compiler_sha256'] == receipt['stage2_sha256'] == receipt['stage3_sha256']
          compiler.chmod(compiler.stat().st_mode | 0o111)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('compiler=' + compiler.as_posix() + '\n')
          PYCODE
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
      - name: Measure paired parallel builds and complete test suites
        shell: bash
        env:
          BENCHMARK_EXECUTABLE: ${{ inputs.executable }}
          BASELINE_COMPILER: ${{ steps.baseline.outputs.compiler }}
          BASELINE_SHA: ${{ steps.baseline.outputs.sha }}
          BENCHMARK_JOBS: ${{ inputs.performance_jobs }}
          BENCHMARK_REPETITION: ${{ matrix.repetition }}
        run: |
          set -euo pipefail
          benchmark_bash="$BASH"
          if command -v cygpath >/dev/null 2>&1; then
            benchmark_bash=$(cygpath -m "$BASH")
          fi
          python3 scripts/benchmark-compiler-tests.py "target/stage3/$BENCHMARK_EXECUTABLE" \
            --baseline-compiler "$BASELINE_COMPILER" --baseline-ref "$BASELINE_SHA" \
            --bash "$benchmark_bash" --scenario all --jobs "$BENCHMARK_JOBS" --warm \
            --repetitions 1 --first-repetition "$BENCHMARK_REPETITION" \
            --output target/performance/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-performance-${{ inputs.triple }}-r${{ matrix.repetition }}
          path: target/performance
          if-no-files-found: error
          retention-days: 30

  performance-summary:
    name: Summarize paired performance ${{ inputs.triple }}
    if: ${{ always() && inputs.performance_baseline_tag != '' }}
    needs: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: compiler-performance-${{ inputs.triple }}-r*
          path: target/performance-inputs
      - name: Require complete pairs and calculate medians within each runner
        run: |
          python3 scripts/aggregate-compiler-benchmarks.py target/performance-inputs \
            --repetitions 3 --output target/performance/results.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compiler-performance-${{ inputs.triple }}
          path: |
            target/performance
            target/performance-inputs
          if-no-files-found: error
          retention-days: 30
