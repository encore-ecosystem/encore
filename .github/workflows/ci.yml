name: Generator SDK integration probe
on:
  workflow_dispatch:
    inputs:
      compiler_run:
        description: Reuse a compiler built for the same candidate sources
        default: ''
      groups:
        description: JSON list of verification groups
        default: '["language", "ehir", "metadata", "format"]'
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GENERATOR_PROBE_GROUP: build
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare native toolchain
        run: bash scripts/ci-prepare-toolchain.sh x86_64-unknown-linux-gnu
      - name: Build compiler and check generators
        if: inputs.compiler_run == ''
        run: python3 scripts/ci-generators-probe.py
      - name: Reuse candidate compiler
        if: inputs.compiler_run != ''
        env:
          COMPILER_RUN: ${{ inputs.compiler_run }}
        run: gh run download "$COMPILER_RUN" --repo encore-ecosystem/encore --name generator-probe-compiler --dir target/extreme
      - uses: actions/upload-artifact@v7
        with:
          name: generator-probe-compiler
          path: target/extreme/encore
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generator-probe-build
          path: |
            target/generator-probe/*.log
            target/generator-probe/*.json
            target/generator-probe/formatted-sources.tar.gz
            target/tests/*.output.txt
            packages/ehir/target/tests/*.output.txt
            target/ci-tests/generator-probe/target/tests/*.output.txt
          retention-days: 7

  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.groups) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GENERATOR_PROBE_GROUP: ${{ matrix.group }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare native toolchain
        run: bash scripts/ci-prepare-toolchain.sh x86_64-unknown-linux-gnu
      - uses: actions/download-artifact@v8
        with:
          name: generator-probe-compiler
          path: target/extreme
      - name: Verify generator group
        run: python3 scripts/ci-generators-probe.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: generator-probe-${{ matrix.group }}
          path: |
            target/generator-probe/*.log
            target/generator-probe/*.json
            target/generator-probe/formatted-sources.tar.gz
            target/tests/*.output.txt
            target/tests/*.ehir
            target/tests/*.ll
            packages/ehir/target/tests/*.output.txt
            target/ci-tests/generator-probe/target/tests/*.output.txt
            target/ci-tests/generator-probe/target/integration/generator-metadata-*/consumer/target/dev/**/*.ll
            target/ci-tests/generator-probe/target/integration/generator-metadata-*/consumer/target/dev/**/*.ehir
            target/ci-tests/generator-probe/target/integration/generator-metadata-*/cache/**/*.ermeta
            target/ci-tests/generator-probe/target/integration/generator-metadata-*/cache/**/*.ertemplate
          retention-days: 7
