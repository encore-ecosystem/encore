name: Native CI

on:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/a931b185d56bc9ae9515cfdabde721486a8c7b0c

jobs:
  native:
    name: Verify ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' encore.toml | head -n 1)" = "$version"
          test "$(sed -n 's/.*ret "\([^"]*\)".*/\1/p' src/version.enq)" = "$version"

      - name: Download latest complete trusted compiler
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seeds
          current=${GITHUB_REF_NAME:-}
          selected=
          while IFS= read -r tag; do
            test "$tag" != "$current" || continue
            case "$tag" in channel-*) continue ;; esac
            extension=tar.gz
            case "${{ matrix.triple }}" in *-windows-*) extension=zip ;; esac
            asset="encore-${{ matrix.triple }}.$extension"
            candidate="target/seeds/$tag"
            mkdir -p "$candidate"
            if gh release download "$tag" \
              --pattern "$asset" \
              --pattern "$asset.sha256" \
              --dir "$candidate" >/dev/null 2>&1
            then
              selected=$tag
              echo "SEED_DOWNLOAD_DIR=$PWD/$candidate" >> "$GITHUB_ENV"
              break
            fi
          done < <(gh release list --limit 100 --json tagName,isDraft \
            --jq '.[] | select(.isDraft == false) | .tagName')
          test -n "$selected" || {
            echo "::error::No complete trusted release contains ${{ matrix.triple }}"
            exit 1
          }
          echo "tag=$selected" >> "$GITHUB_OUTPUT"

      - name: Verify and extract trusted compiler
        shell: bash
        run: |
          set -euo pipefail
          extension=tar.gz
          case "${{ matrix.triple }}" in *-windows-*) extension=zip ;; esac
          asset="encore-${{ matrix.triple }}.$extension"
          expected=$(awk 'NF {print tolower($1); exit}' "$SEED_DOWNLOAD_DIR/$asset.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$SEED_DOWNLOAD_DIR/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$SEED_DOWNLOAD_DIR/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          mkdir -p target/seed-unpacked
          case "$extension" in
            zip) unzip -q "$SEED_DOWNLOAD_DIR/$asset" -d target/seed-unpacked ;;
            *) tar -xzf "$SEED_DOWNLOAD_DIR/$asset" -C target/seed-unpacked ;;
          esac
          distribution=$(find target/seed-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -n "$distribution"
          test -s "$distribution/bin/${{ matrix.executable }}"
          test -f "$distribution/lib/encore/index/core/encore.toml"
          echo "ENCORE_HOME=$PWD/$distribution" >> "$GITHUB_ENV"
          echo "ENCORE_CORE_DIR=$PWD/$distribution/lib/encore/index/core" >> "$GITHUB_ENV"
          echo "SEED_COMPILER=$PWD/$distribution/bin/${{ matrix.executable }}" >> "$GITHUB_ENV"

      - name: Resolve pinned compiler dependencies
        shell: bash
        run: |
          set -euo pipefail
          if test "${{ matrix.triple }}" = x86_64-pc-windows-msvc; then
            awk '
              function emit() { if (name != "" && archive != "") print name "\t" version "\t" checksum "\t" archive }
              /^\[\[packages\]\]$/ { emit(); name=version=checksum=archive=""; next }
              /^name = / { name=$3; gsub(/"/, "", name) }
              /^version = / { version=$3; gsub(/"/, "", version) }
              /^checksum = / { checksum=$3; gsub(/"/, "", checksum) }
              /^archive = / { archive=$3; gsub(/"/, "", archive) }
              END { emit() }
            ' encore.lock |
            while IFS=$'\t' read -r name version checksum archive; do
              destination="$PWD/target/registry/packages/$name/$version-$checksum"
              mkdir -p "$destination"
              curl --fail --location --retry 5 "$archive" -o target/registry-package.tar.gz
              tar -xzf target/registry-package.tar.gz -C "$destination"
            done
          fi
          "$SEED_COMPILER" sync

      - name: Verify byte-identical two-stage self-host
        shell: bash
        run: |
          set -euo pipefail
          "$SEED_COMPILER" build --profile extreme
          mkdir -p target/stage1
          cp "target/extreme/${{ matrix.executable }}" "target/stage1/${{ matrix.executable }}"
          mv target/extreme target/stage1-output
          "target/stage1/${{ matrix.executable }}" build --profile extreme
          mkdir -p target/stage2
          cp "target/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          cmp "target/stage1/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          "target/stage2/${{ matrix.executable }}" --version

      - name: Run compiler tests
        shell: bash
        run: |
          set -euo pipefail
          "target/stage2/${{ matrix.executable }}" test

      - name: Build examples
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage2/${{ matrix.executable }}"
          for manifest in examples/*/encore.toml; do
            example=${manifest%/encore.toml}
            case "$example" in examples/bare_metal) continue ;; esac
            (cd "$example" && "$compiler" build)
          done
          (cd examples/bare_metal && "$compiler" build --target thumbv7em-none-eabi --emit llvm-ir)

      - uses: actions/upload-artifact@v7
        with:
          name: verified-${{ matrix.triple }}
          path: target/stage2/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 7
