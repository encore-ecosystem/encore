name: Compare MSVC compiler performance
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/checkout@v6
        with:
          ref: 71843a74db8366f0171c25217ceca0861e81daff
          path: baseline
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare native toolchain
        shell: bash
        run: bash scripts/ci-prepare-toolchain.sh x86_64-pc-windows-msvc
      - name: Restore the two verified native compilers
        shell: bash
        run: |
          gh run download 42350398703 --repo encore-ecosystem/encore --name test-context-x86_64-pc-windows-msvc --dir target/performance/baseline
          gh run download 42373979388 --repo encore-ecosystem/encore --name test-context-x86_64-pc-windows-msvc --dir target/performance/candidate
      - name: Compare the same compiler test on one runner
        run: python scripts/ci-msvc-performance.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: msvc-performance
          path: |
            target/performance/**
          retention-days: 7
