name: SDK pipeline fixture probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixtures:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-26]
    runs-on: ${{ matrix.runner }}
    env:
      ENCORE_TEST_REPOSITORY: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Archive contract
        shell: bash
        run: |
          mkdir -p target/pipeline-probes
          bash tests/ci/pipeline.sh archive > target/pipeline-probes/archive.log 2>&1 || { cat target/pipeline-probes/archive.log; exit 1; }
      - name: Pre-reflection seed contract
        if: '!cancelled()'
        shell: bash
        run: |
          mkdir -p target/pipeline-probes
          bash tests/ci/pipeline.sh seed-compat > target/pipeline-probes/seed-compat.log 2>&1 || { cat target/pipeline-probes/seed-compat.log; exit 1; }
      - name: Stage3 restore contract
        if: '!cancelled()'
        shell: bash
        run: |
          mkdir -p target/pipeline-probes
          bash tests/ci/pipeline.sh restore-context > target/pipeline-probes/restore-context.log 2>&1 || { cat target/pipeline-probes/restore-context.log; exit 1; }
      - name: Remaining pipeline contracts
        if: '!cancelled()'
        shell: bash
        run: |
          mkdir -p target/pipeline-probes
          failed=0
          for mode in exact merge changed expired incomplete fork unmerged failed legacy required bootstrap mismatch build-failure native-windows-x86 native-windows-arm; do
            if bash tests/ci/pipeline.sh "$mode" > "target/pipeline-probes/$mode.log" 2>&1; then
              echo "$mode passed"
            else
              cat "target/pipeline-probes/$mode.log"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-probes-${{ matrix.runner }}
          path: target/pipeline-probes/*.log
