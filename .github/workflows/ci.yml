name: Language bridge focused verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_INDEX_URL: http://127.0.0.1:9/index
      ENCORE_CORE_DIR: ${{ github.workspace }}/packages/core
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Prepare native toolchain
        run: bash scripts/ci-prepare-toolchain.sh x86_64-unknown-linux-gnu
      - name: Regenerate declaration, source and lowering codecs
        run: |
          mkdir -p target/language-bridge-probe
          python3 scripts/generate-frontend-artifact-codec.py
          python3 scripts/generate-translation-environment-codec.py
          python3 scripts/generate-source-artifact-codec.py
          tar -czf target/language-bridge-probe/generated-sources.tar.gz src/frontend/semantic_codec.enq src/frontend/semantic_replay_codec.enq src/frontend/source_codec.enq src/frontend/translator_environment_codec.enq
      - name: Verify release metadata and canonical SDK exports
        run: |
          python3 scripts/test-project-metadata.py
          python3 scripts/test-sdk-packages.py
      - name: Restore and verify published 0.1.15 seed
        run: |
          mkdir -p target/bridge-seed
          gh release download v0.1.15-neumann --repo encore-ecosystem/encore --pattern encore-x86_64-unknown-linux-gnu.tar.gz --pattern encore-x86_64-unknown-linux-gnu.tar.gz.sha256 --dir target/bridge-seed
          (cd target/bridge-seed && sha256sum -c encore-x86_64-unknown-linux-gnu.tar.gz.sha256)
          tar -xzf target/bridge-seed/encore-x86_64-unknown-linux-gnu.tar.gz -C target/bridge-seed
      - name: Build the language bridge from the published seed
        run: |
          seed="$PWD/target/bridge-seed/encore-0.1.15-neumann-x86_64-unknown-linux-gnu/bin/encore"
          chmod +x "$seed"
          ENCORE_BUILD_CACHE="$PWD/target/bridge-seed-cache" bash scripts/ci-seed-build.sh "$seed" v0.1.15-neumann build --profile extreme > target/language-bridge-probe/build.log 2>&1 || { cat target/language-bridge-probe/build.log; exit 1; }
          target/extreme/encore --version
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: language-bridge-build
          path: |
            target/language-bridge-probe/**
            target/diagnostics/**
      - uses: actions/upload-artifact@v7
        with:
          name: language-bridge-compiler
          path: target/extreme/encore
