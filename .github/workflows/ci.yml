name: Native CI

on:
  pull_request:
  push:
    branches: [trunk, nightly, "feature/**"]

permissions:
  contents: read

jobs:
  bootstrap-ir:
    name: Generate bootstrap IR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify native stage0
        run: sha256sum --check bootstrap/encore-stage0-linux-x86_64.sha256
      - name: Generate target IR
        working-directory: index/encore
        run: |
          mkdir -p target
          gzip -dc ../../bootstrap/encore-stage0-linux-x86_64.gz > target/encore-stage0
          chmod +x target/encore-stage0
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc
          do
            ./target/encore-stage0 build --profile extreme --target "$triple" --emit llvm-ir
          done
      - uses: actions/upload-artifact@v4
        with:
          name: bootstrap-ir
          path: index/encore/target/*/extreme/encore.ll
          if-no-files-found: error
          retention-days: 1

  native:
    name: ${{ matrix.triple }}
    needs: bootstrap-ir
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/core
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-ir
          path: index/encore/target
      - name: Assemble native seed
        shell: bash
        run: |
          mkdir -p index/encore/target/extreme
          set +e
          output=$(clang -O0 -w \
            index/encore/target/${{ matrix.triple }}/extreme/encore.ll \
            core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            -o index/encore/target/extreme/${{ matrix.executable }} 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            diagnostic=$(printf '%s' "$output" | tail -c 7000)
            message=${diagnostic//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Native seed assembly failed::$message"
            exit "$code"
          fi
      - name: Verify native seed
        shell: bash
        run: |
          index/encore/target/extreme/${{ matrix.executable }} --version
      - name: Native self-host generation 1
        shell: bash
        working-directory: index/encore
        run: |
          set +e
          output=$(./target/extreme/${{ matrix.executable }} build --profile debug --target ${{ matrix.triple }} 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            message=${output//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Native self-host failed::$message"
            exit "$code"
          fi
      - name: Promote target-correct compiler
        shell: bash
        working-directory: index/encore
        run: cp target/${{ matrix.triple }}/debug/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
      - name: Native self-host generation 2
        shell: bash
        working-directory: index/encore
        run: |
          set +e
          output=$(./target/extreme/${{ matrix.executable }} build --profile extreme 2>&1)
          code=$?
          set -e
          printf '%s\n' "$output"
          if [ "$code" -ne 0 ]; then
            diagnostic=$(printf '%s' "$output" | tail -c 7000)
            message=${diagnostic//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Second native self-host failed::$message"
            exit "$code"
          fi
      - name: Core tests
        shell: bash
        working-directory: core
        run: ../index/encore/target/extreme/${{ matrix.executable }} test
      - name: Target and negative-diagnostic tests
        shell: bash
        working-directory: index/encore
        run: |
          ./target/extreme/${{ matrix.executable }} test --filter target_
          ./target/extreme/${{ matrix.executable }} test --filter unknown_variable_diagnostic
      - name: Portable package smoke test
        shell: bash
        run: |
          mkdir -p dist
          scripts/package-release.sh index/encore/target/extreme/${{ matrix.executable }} ${{ matrix.triple }} ci dist

  full-tests:
    name: Full native test suite
    needs: bootstrap-ir
    runs-on: ubuntu-latest
    env:
      ENCORE_CORE_DIR: ${{ github.workspace }}/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bootstrap-ir
          path: index/encore/target
      - name: Assemble native seed
        run: |
          mkdir -p index/encore/target/extreme
          clang -O0 -w \
            index/encore/target/x86_64-unknown-linux-gnu/extreme/encore.ll \
            core/runtime.c index/ehir-llvm-backend/runtime.c index/rich/runtime.c \
            -o index/encore/target/extreme/encore
      - name: Build current compiler twice
        working-directory: index/encore
        run: |
          ./target/extreme/encore build --profile debug --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/debug/encore target/extreme/encore
          ./target/extreme/encore build --profile extreme
      - name: Test native packages
        run: |
          compiler="$PWD/index/encore/target/extreme/encore"
          for package in core index/ehir index/ehir-llvm-backend index/json index/log index/rich index/std index/toml; do
            (cd "$package" && "$compiler" test)
          done
          (cd index/encore && ./target/extreme/encore test)
