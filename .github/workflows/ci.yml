name: Release candidate corrections

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows-native:
    name: Native network ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-windows-gnu
            runner: windows-latest
          - target: aarch64-w64-windows-gnu
            runner: windows-11-arm
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Prepare native toolchain
        shell: bash
        run: |
          mkdir -p target
          bash scripts/ci-prepare-toolchain.sh "${{ matrix.target }}"
      - uses: actions/download-artifact@v8
        if: contains(matrix.target, 'windows-gnu')
        with:
          name: windows-openssl-${{ matrix.target }}
          path: target/windows-openssl
          github-token: ${{ github.token }}
          run-id: 45617700138
      - name: Build native Windows MSVC OpenSSL
        if: contains(matrix.target, 'windows-msvc')
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $install = & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$install) { throw 'Visual Studio C++ installation is required' }
          $vars = Join-Path $install 'VC\Auxiliary\Build\vcvars64.bat'
          $environment = & $env:ComSpec /d /c "call `"$vars`" >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'vcvars64.bat failed' }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') { [Environment]::SetEnvironmentVariable($Matches[1], $Matches[2], 'Process') }
          }
          $perl = "$env:SystemDrive\Strawberry\perl\bin\perl.exe"
          if (!(Test-Path $perl)) { $perl = (Get-Command perl.exe -CommandType Application).Source }
          & $perl -MIPC::Cmd -e 1
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL requires a complete Windows Perl installation' }
          $env:OPENSSL_PERL = $perl
          & bash scripts/build-windows-openssl.sh '${{ matrix.target }}' target/windows-openssl
          if ($LASTEXITCODE -ne 0) { throw 'OpenSSL build failed' }

      - name: Test native TCP, TLS and local IPC
        shell: bash
        run: |
          set -euo pipefail
          export CC="${ENCORE_CC:-clang}"
          case '${{ matrix.target }}' in
            *-windows-*) export OPENSSL_DIR=$(cygpath -m "$PWD/target/windows-openssl") ;;
            *-apple-darwin) export OPENSSL_DIR=$(brew --prefix openssl@3) ;;
          esac
          python3 packages/network/tests/run-native.py


  linux-cache:
    name: Cache lifecycle on Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: test-context-x86_64-unknown-linux-gnu
          path: target/test-context
          github-token: ${{ github.token }}
          run-id: 45617700138
      - name: Prepare native toolchain
        run: bash scripts/ci-prepare-toolchain.sh x86_64-unknown-linux-gnu
      - name: Verify the compiler and exercise the cache lifecycle
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/test-context/bin/encore"
          sha=$(jq -r .compiler_sha256 target/test-context/provenance.json)
          echo "$sha  $compiler" | sha256sum -c -
          chmod +x "$compiler"
          python3 scripts/test-cache-lifecycle.py --compiler "$compiler"
