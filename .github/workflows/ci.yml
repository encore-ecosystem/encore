name: Native CI

on:
  pull_request:
  push:
    branches: [trunk, nightly, "feature/**"]

permissions:
  contents: read

env:
  BOOTSTRAP_REF: e1fccafb2b3a37dcf549123ae3896fe80e96e03f

jobs:
  native:
    name: ${{ matrix.triple }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOTSTRAP_REF }}
          path: .bootstrap
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build native seed from the frozen v0.1.2 compiler
        shell: bash
        working-directory: .bootstrap/index/encore
        env:
          ENCORE_CACHE_DIR: ${{ runner.temp }}/encore-stage0-cache
        run: uv run --no-dev --project ../.. encore-py build --profile extreme
      - name: Promote frozen native seed
        shell: bash
        run: |
          mkdir -p index/encore/target/extreme
          cp .bootstrap/index/encore/target/extreme/${{ matrix.executable }} index/encore/target/extreme/${{ matrix.executable }}
      - name: Native self-host generation 1
        shell: bash
        working-directory: index/encore
        run: ./target/extreme/${{ matrix.executable }} build --profile extreme --target ${{ matrix.triple }}
      - name: Promote target-correct compiler
        shell: bash
        working-directory: index/encore
        run: cp target/${{ matrix.triple }}/extreme/${{ matrix.executable }} target/extreme/${{ matrix.executable }}
      - name: Native self-host generation 2
        shell: bash
        working-directory: index/encore
        run: ./target/extreme/${{ matrix.executable }} build --profile extreme
      - name: Core tests
        shell: bash
        working-directory: core
        run: ../index/encore/target/extreme/${{ matrix.executable }} test
      - name: Target and negative-diagnostic tests
        shell: bash
        working-directory: index/encore
        run: |
          ./target/extreme/${{ matrix.executable }} test --filter target_
          ./target/extreme/${{ matrix.executable }} test --filter unknown_variable_diagnostic
      - name: Portable package smoke test
        shell: bash
        run: |
          mkdir -p dist
          scripts/package-release.sh index/encore/target/extreme/${{ matrix.executable }} ${{ matrix.triple }} ci dist

  full-tests:
    name: Full native test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BOOTSTRAP_REF }}
          path: .bootstrap
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bootstrap compiler
        working-directory: .bootstrap/index/encore
        env:
          ENCORE_CACHE_DIR: ${{ runner.temp }}/encore-stage0-cache
        run: uv run --no-dev --project ../.. encore-py build --profile extreme
      - name: Promote frozen native seed
        run: |
          mkdir -p index/encore/target/extreme
          cp .bootstrap/index/encore/target/extreme/encore index/encore/target/extreme/encore
      - name: Build current compiler twice
        working-directory: index/encore
        run: |
          ./target/extreme/encore build --profile extreme --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/extreme/encore target/extreme/encore
          ./target/extreme/encore build --profile extreme
      - name: Test native packages
        run: |
          compiler="$PWD/index/encore/target/extreme/encore"
          for package in core index/ehir index/ehir-llvm-backend index/json index/log index/rich index/std index/toml; do
            (cd "$package" && "$compiler" test)
          done
          (cd index/encore && ./target/extreme/encore test)
