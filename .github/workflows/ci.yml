name: Native CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  candidate:
    name: Select verified candidate
    runs-on: ubuntu-latest
    outputs:
      reused: ${{ steps.select.outputs.reused }}
    steps:
      - uses: actions/checkout@v6
      - name: Reuse identical merged PR build
        id: select
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/select-ci-candidate.py

  resolve-inputs:
    needs: candidate
    if: needs.candidate.outputs.reused != 'true'
    name: Resolve trusted inputs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/dependencies/registry
    outputs:
      seed_tag: ${{ steps.seed.outputs.tag }}
      index_sha: ${{ steps.index.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Record original build identity
        shell: bash
        run: |
          jq -n --arg commit "$GITHUB_SHA" --arg tree "$(git rev-parse HEAD^{tree})" \
            '{commit: $commit, tree: $tree}' > build-identity.json
      - uses: actions/upload-artifact@v7
        with:
          name: build-identity
          path: build-identity.json
          retention-days: 30
      - name: Select latest stable compiler once
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          required='[
            "encore-x86_64-unknown-linux-gnu.tar.gz",
            "encore-aarch64-unknown-linux-gnu.tar.gz",
            "encore-aarch64-apple-darwin.tar.gz",
            "encore-x86_64-pc-windows-msvc.zip"
          ]'
          releases=$(gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease)
          selected=$(jq -r '[.[] | select(.isDraft == false and .isPrerelease == false)
            | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z][a-z0-9-]*)?$"))]
            | sort_by(.publishedAt) | last | .tagName // empty' <<<"$releases")
          test -n "$selected" || { echo "::error::No stable compiler release is available"; exit 1; }
          assets=$(gh release view "$selected" --json isDraft,isPrerelease,assets)
          test "$(jq -r '.isDraft or .isPrerelease' <<<"$assets")" = false
          if ! jq -e --argjson required "$required" \
            '([.assets[].name] as $actual | $required - $actual | length) == 0' <<<"$assets" >/dev/null
          then
            echo "::error::Latest stable seed $selected is incomplete; refusing an older fallback"
            exit 1
          fi
          echo "tag=$selected" >> "$GITHUB_OUTPUT"
          echo "### Trusted seed: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin system-library source
        id: index
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          # Reviewed Neumann 0.1.2 system sources, shared by bootstrap and tests.
          # Keep this immutable: rebuilding a compiler commit must not follow main.
          sha=63872a4599b566356774dda667eef4a3ad5c06d3
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ENCORE_INDEX_URL=https://raw.githubusercontent.com/encore-ecosystem/encore-index/$sha" >> "$GITHUB_ENV"
          echo "### System libraries: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          repository: encore-ecosystem/encore-index
          ref: ${{ steps.index.outputs.sha }}
          path: target/dependency-source

      - name: Build verified dependency bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dependencies/registry
          cp encore.lock target/dependencies/encore.lock
          test "$(git -C target/dependency-source rev-parse HEAD)" = "${{ steps.index.outputs.sha }}"
          mkdir -p target/dependencies/system-index
          git -C target/dependency-source archive HEAD | tar -xf - -C target/dependencies/system-index
          printf '%s\n' '${{ steps.index.outputs.sha }}' > target/dependencies/index-commit
          find target/dependencies -exec touch -t 200001010000.00 {} +
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C target -czf target/dependencies.tar.gz dependencies
          sha256sum target/dependencies.tar.gz > target/dependencies.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: trusted-dependencies
          path: |
            target/dependencies.tar.gz
            target/dependencies.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  target-kits:
    name: Target kit ${{ matrix.target }}
    needs: resolve-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-windows-gnu
            kind: windows
          - target: aarch64-w64-windows-gnu
            kind: windows
          - target: aarch64-unknown-linux-gnu
            kind: linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: trusted-dependencies
          path: target/dependency-download
      - name: Activate verified target-kit sources
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk 'NF {print tolower($1); exit}' target/dependency-download/dependencies.tar.gz.sha256)
          actual=$(sha256sum target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf target/dependency-download/dependencies.tar.gz -C target
          test "$(cat target/dependencies/index-commit)" = "${{ needs.resolve-inputs.outputs.index_sha }}"
          mv target/dependencies/system-index target/system-index
      - name: Download verified Linux llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          version=20260616
          archive="llvm-mingw-$version-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL --retry 2 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive" \
            -o "target/$archive"
          test "$(sha256sum "target/$archive" | awk '{print $1}')" = \
            "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
          mkdir -p target/llvm-mingw
          tar -xJf "target/$archive" -C target/llvm-mingw --strip-components=1
      - name: Assemble Linux AArch64 sysroot
        if: matrix.kind == 'linux-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-linux-aarch64-sysroot.sh target/llvm-mingw/sysroot

      - name: Check Windows credential runtime before bootstrapping
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          target/llvm-mingw/bin/clang --target="${{ matrix.target }}" \
            -Wall -Wextra -Werror -c target/system-index/packages/secret-store/runtime.c \
            -o target/secret-store.obj
      - name: Build reproducible target kit
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          args=(
            --host x86_64-unknown-linux-gnu \
            --target "${{ matrix.target }}" \
            --toolchain target/llvm-mingw \
            --platform target/system-index/packages/platform \
            --out target/target-kits \
            --compiler bin/clang \
            --linker bin/clang \
            --archiver bin/llvm-ar \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$release"
          )
          if [[ "${{ matrix.kind }}" == linux-aarch64 ]]; then
            args+=(--sysroot sysroot --link-arg "-fuse-ld=lld")
          fi
          scripts/build-target-kit.sh "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-target-kit-${{ matrix.target }}
          path: target/target-kits
          if-no-files-found: error
          retention-days: 30

  stage1-linux:
    name: Stage1 linux
    needs: [resolve-inputs, target-kits]
    uses: ./.github/workflows/ci-stage1.yml
    with:
      runner: ubuntu-latest
      producer: linux
      seed_triple: x86_64-unknown-linux-gnu
      seed_executable: encore
      targets: x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-w64-windows-gnu aarch64-w64-windows-gnu
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  stage1-darwin:
    name: Stage1 darwin
    needs: resolve-inputs
    uses: ./.github/workflows/ci-stage1.yml
    with:
      runner: macos-15
      producer: darwin
      seed_triple: aarch64-apple-darwin
      seed_executable: encore
      targets: aarch64-apple-darwin
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  stage1-windows:
    name: Stage1 windows
    needs: resolve-inputs
    uses: ./.github/workflows/ci-stage1.yml
    with:
      runner: windows-latest
      producer: windows
      seed_triple: x86_64-pc-windows-msvc
      seed_executable: encore.exe
      targets: x86_64-pc-windows-msvc
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-linux-x86:
    name: Verify x86_64-unknown-linux-gnu
    needs: [resolve-inputs, stage1-linux]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ubuntu-latest
      triple: x86_64-unknown-linux-gnu
      executable: encore
      producer: linux
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-linux-arm:
    name: Verify aarch64-unknown-linux-gnu
    needs: [resolve-inputs, stage1-linux]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: ubuntu-24.04-arm
      triple: aarch64-unknown-linux-gnu
      executable: encore
      producer: linux
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-macos-arm:
    name: Verify aarch64-apple-darwin
    needs: [resolve-inputs, stage1-darwin]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: macos-15
      triple: aarch64-apple-darwin
      executable: encore
      producer: darwin
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-windows-msvc-x86:
    name: Verify x86_64-pc-windows-msvc
    needs: [resolve-inputs, stage1-windows]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: windows-latest
      triple: x86_64-pc-windows-msvc
      executable: encore.exe
      producer: windows
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-windows-gnu-x86:
    name: Verify x86_64-w64-windows-gnu
    needs: [resolve-inputs, stage1-linux]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: windows-latest
      triple: x86_64-w64-windows-gnu
      executable: encore.exe
      producer: linux
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}

  verify-windows-gnu-arm:
    name: Verify aarch64-w64-windows-gnu
    needs: [resolve-inputs, stage1-linux]
    uses: ./.github/workflows/ci-native.yml
    with:
      runner: windows-11-arm
      triple: aarch64-w64-windows-gnu
      executable: encore.exe
      producer: linux
      seed_tag: ${{ needs.resolve-inputs.outputs.seed_tag }}
      index_sha: ${{ needs.resolve-inputs.outputs.index_sha }}
